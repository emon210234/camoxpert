[project]
name = "camoxpert"
version = "1.0.0"
description = "CamoXpert: camouflaged object detection with a PVTv2-B5 encoder (code for the JVCI manuscript)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",          # needed by timm
    "timm==0.9.12",                 # PVTv2 building blocks (DropPath, trunc_normal_)
    "einops==0.7.0",                # ZoomNeXt's MHSIU
    "albumentations==1.3.1",        # same version as the legacy pipeline
    "opencv-python-headless==4.8.1.78",
    "numpy==1.26.4",                # albumentations 1.3.1 / OpenCV 4.8 predate NumPy 2
    "pysodmetrics==1.4.2",          # S-measure, weighted F, E-measure, MAE
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8"]

# CUDA 12.6 builds of PyTorch for Windows and Linux (RTX 4090 = compute capability 8.9).
# PyPI's Windows torch wheels are CPU-only, hence the extra index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camoxpert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 119
